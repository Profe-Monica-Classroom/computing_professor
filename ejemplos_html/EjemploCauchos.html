<!DOCTYPE html>
<html>
    <header>
        <title>Ejemplo Inventario Cauchos</title>
        
        <meta charset="utf-8" />
        
        <link rel="stylesheet" href="bootstrap.min.css" />
        <link rel="stylesheet" href="bootstrap-theme.min.css" />
        <link rel="stylesheet" href="jquery-ui.min.css" />
        <link rel="stylesheet" href="style.css" />
        <div>
            <img src="imagen1.jpg" alt="Esto es una imagen" class="img-thumbnail">
        </div><!--<img src="">-->
        <script src="http://code.jquery.com/jquery-1.11.2.min.js"></script>
    </header>
    <body>
        <div  class="container">
            <h1 class="page-header">
                <p>Registro de Inventario de Cauchos en Computación 1 S37</p>
            </h1>
            <ol class="breadcrumb">
                <li><a href="EjemploCauchos.html">Home Inventario Cauchos</a></li>    
            </ol>
            <div style="width: 50%;"> <!-- A PARTIR DE AQUI INICIAN LOS CAMPOS DEL FORMULARIO-->
                <form action="" method="post" enctype="multipart/form-data">
                    <div class="form-group">
                        <label> Marca: </label>
                        <input type="text" name="marca" value="Indique aquí la marca" class="form-control" placeholder="Ingrese nombre de la marca" data-validacion-tipo="requerido|min:3" id="marca" />
                    </div>
                    <div class="form-group">
                        <label> Rin: </label>
                        <input type="text" name="rin" value="Indique aquí el RiN" class="form-control" placeholder="Ingrese EL RIN" data-validacion-tipo="requerido|min:2" />
                    </div>
                    <div class="form-group">
                        <label> Ancho: </label>
                        <input type="number" name="ancho" value="50" class="form-control" placeholder="Ingrese el ancho del caucho" data-validacion-tipo="requerido|min:2" />
                    </div>
                    <div class="form-group">
                        <label> Costo:</label>
                        <input type="text" name="costo" value="50" class="form-control" placeholder="Ingrese el costo del caucho" data-validacion-tipo="requerido|min:2" />
                    </div>
                    <div class="form-group">
                        <label> Tipo de Libro: </label>
                        <input type="text" name="tipolibro" value="Misterio" class="form-control" placeholder="Ingrese el tipo de libro" data-validacion-tipo="requerido|min:3" />
                    </div>
                    <div class="form-group">
                        <label> Cantidad de Cauchos:	</label>
                        <input type="number" name="cantidad" value="15" class="form-control" placeholder="Ingrese la cantidad de libros" data-validacion-tipo="requerido|min:1" />
                    </div>
                    <div class="form-group">
                        <label> Disponible:	</label>
                        <div class="form-group">
                            <input type="radio" id="disponible" name="disponible" value="SI">
      						<label for="SI">SI</label>
      						<input type="radio" id="disponible" name="disponible" value="NO">
      						<label for="NO">NO</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label> Editorial: </label>
                        <input type="text" name="editorial" value="Panapo" class="form-control" placeholder="Ingrese la editorial del libro" data-validacion-tipo="requerido|min:3" />
                    </div>
                    <div class="form-group">
                        <label> Fecha de Publicación: </label>
                        <input type="date" name="fecha" value="14/12/2000" class="form-control" placeholder="Ingrese la fecha"  />
                    </div>
                    <div class="text-right">
                        <button class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </body>
    <footer>
        <div class="panel-footer text-center well">
            <p>Computacion 1. Unexpo. Sección 37</p>
        </div>
    </footer>
</html>
